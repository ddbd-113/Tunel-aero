name: testy

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Testy jednostkowe i dymne
        run: pytest -q
      - name: Zestaw scenariuszy (regresja zachowania)
        run: tunel-aero suite --jobs 2
      - name: Samolot z CAD w scenariuszach samolotowych
        run: tunel-aero cad examples/moj_samolot/aircraft.yaml --out wyniki/cad
      - name: Budowa aplikacji webowej
        run: tunel-aero web --build-only --out _site
