# Samolot zaprojektowany w CAD -> model do symulacji.
# Każdą część wyeksportuj z CAD jako osobny plik STL (lub jeden OBJ z nazwanymi obiektami:
# "samolot.obj#skrzydlo"). Program sam wyznaczy przekroje skrzydeł i usterzenia, powierzchnię,
# cięciwę, wznios, zaklinowanie, a z nich - metodą siatki wirowej (VLM) - pochodne stateczności.
#
#   tunel-aero cad examples/moj_samolot/aircraft.yaml           # raport projektowy (CG, stateczność, trym)
#   tunel-aero run scenarios/fixed_wing/01_patrol.yaml --vehicle examples/moj_samolot/aircraft.yaml
#   tunel-aero suite scenarios/fixed_wing --vehicle examples/moj_samolot/aircraft.yaml

type: cad_aircraft
name: "Trener 1.4 m (przykład z CAD)"

units: mm                         # jednostki plików: mm | cm | m | in
axes:                             # orientacja modelu w CAD
  forward: -x                     # w którą stronę patrzy nos (+x, -x, +y, -y, +z, -z)
  up: +z                          # gdzie jest "góra" samolotu

parts:                            # role: wing | htail | vtail | fuselage | other
  skrzydlo:   {file: skrzydlo.stl, role: wing, mass: 0.40}          # masa konstrukcji części [kg]
  usterzenie: {file: ster_wysokosci.stl, role: htail, mass: 0.035}
  statecznik: {file: statecznik.stl, role: vtail, mass: 0.025}
  kadlub:     {file: kadlub.stl, role: fuselage, mass: 0.28}

mass:
  # total: 1.15                   # [kg] masa do lotu - jeśli podasz bez mas części, reszta rozłoży się na części
  # cg: [318, 0, 40]              # środek ciężkości z wyważenia/CAD [mm] - jeśli znasz, odkomentuj
  # inertia: [0.07, 0.09, 0.15, 0.0]   # Ixx, Iyy, Izz, Ixz [kg m^2] z CAD (domyślnie liczone z geometrii)
  components:                     # elementy skupione (pozycje w układzie CAD, mm)
    - {name: silnik,      mass: 0.110, position: [10, 0, 10]}
    - {name: regulator,   mass: 0.030, position: [90, 0, 0]}
    - {name: akumulator,  mass: 0.185, position: [60, 0, 5]}    # przesuwaj, aby wyważyć
    - {name: odbiornik,   mass: 0.012, position: [300, 0, 10]}
    - {name: serwa_lotek, mass: 0.024, position: [300, 0, 55]}
    - {name: serwa_ogona, mass: 0.024, position: [380, 0, 15]}
  # bez mas części: masa (total - komponenty) rozkłada się proporcjonalnie do powierzchni części
  # (structure_model: shell - pianka/balsa/kompozyt) lub objętości (structure_model: solid)

surfaces:
  wing:
    airfoil: {cl_max: 1.3, zero_lift_alpha_deg: -2.1, cm0: -0.05}     # NACA 2412
    controls:
      - {type: aileron, span: [0.55, 0.95], chord_fraction: 0.25, max_deg: 20}
  htail:
    airfoil: {cl_max: 0.9, zero_lift_alpha_deg: 0.0, cm0: 0.0}        # NACA 0009
    controls:
      - {type: elevator, span: [0.0, 1.0], chord_fraction: 0.35, max_deg: 25}
  vtail:
    controls:
      - {type: rudder, span: [0.0, 1.0], chord_fraction: 0.4, max_deg: 25}

propulsion:
  position: [-20, 0, 10]          # środek śmigła [mm]
  kv: 1000                        # obr/min/V
  diameter_in: 10                 # śmigło 10x5
  pitch_in: 5
battery: {cells: 3, capacity_ah: 2.2, r_cell: 0.01}

cruise_speed: 13                  # [m/s] (domyślnie 1.45 x prędkość przeciągnięcia)
limits: {vne: 30, max_load_factor: 6}
cd_extra: 0.008                   # dodatkowy opór (podwozie, szczeliny, anteny)
