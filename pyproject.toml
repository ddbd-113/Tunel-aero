[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tunel-aero"
version = "0.1.0"
description = "Wirtualne środowisko testowe dla dronów i samolotów w realistycznych warunkach (wiatr, turbulencja, mikroburst, oblodzenie, mróz, awarie)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pyyaml>=6", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tunel-aero = "tunel_aero.cli:main"

[tool.setuptools]
packages = ["tunel_aero", "tunel_aero.vehicles", "tunel_aero.control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
